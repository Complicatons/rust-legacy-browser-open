<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
 <title id="t">How Rust Legacy Browser fits together</title>
 <desc id="d">A player's computer talks to your-domain.example to sign in and get a one-use pass, then plays on a server owner's machine through the gateway. The owner's host app reports to the website.</desc>
 <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cd5a28"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fa9a0"/></marker>
  <style>
   .lbl{font:700 12px "JetBrains Mono RLB",Consolas,monospace;fill:#7f7b75;letter-spacing:.12em}
   .h{font:800 17px "Archivo RLB","Arial Black",sans-serif;fill:#f2efe9}
   .s{font:14px system-ui,"Segoe UI",sans-serif;fill:#b9b5ae}
   .n{font:700 13px "JetBrains Mono RLB",Consolas,monospace;fill:#0a0a0a}
   .e{font:13px system-ui,"Segoe UI",sans-serif;fill:#b9b5ae}
  </style>
 </defs>
 <rect width="960" height="600" fill="#0a0a0a"/>

 <!-- Player's computer -->
 <text class="lbl" x="24" y="40">PLAYER'S COMPUTER</text>
 <rect x="24" y="56" width="250" height="110" rx="4" fill="#181818" stroke="#363636"/>
 <text class="h" x="42" y="90">Web browser</text>
 <text class="s" x="42" y="116">Plays in the tab.</text>
 <text class="s" x="42" y="138">Nothing to install.</text>
 <rect x="24" y="190" width="250" height="150" rx="4" fill="#181818" stroke="#363636"/>
 <text class="h" x="42" y="224">Game loader</text>
 <text class="s" x="42" y="250">Sign in or sign up, pick a</text>
 <text class="s" x="42" y="272">server, press Play. Starts</text>
 <text class="s" x="42" y="294">your own desktop game and</text>
 <text class="s" x="42" y="316">keeps your session alive.</text>

 <!-- Website -->
 <text class="lbl" x="355" y="40">THE WEBSITE</text>
 <rect x="355" y="56" width="250" height="194" rx="4" fill="#181818" stroke="#cd5a28"/>
 <text class="h" x="373" y="90">your-domain.example</text>
 <text class="s" x="373" y="118">Your account</text>
 <text class="s" x="373" y="140">The server list</text>
 <text class="s" x="373" y="162">One-use passes to join</text>
 <text class="s" x="373" y="184">Bans and reports</text>
 <text class="s" x="373" y="206">Owners' console and</text>
 <text class="s" x="373" y="228">admin pages</text>

 <!-- Owner's machine -->
 <text class="lbl" x="686" y="40">SERVER OWNER'S PC OR VPS</text>
 <rect x="686" y="56" width="250" height="520" rx="4" fill="#111111" stroke="#363636"/>
 <text class="h" x="704" y="90">Rust Legacy Host</text>
 <text class="s" x="704" y="114">Runs and watches it all</text>
 <rect x="704" y="132" width="214" height="74" rx="3" fill="#222222" stroke="#363636"/>
 <text class="h" x="720" y="162">Gateway</text>
 <text class="s" x="720" y="186">Lets players in</text>
 <rect x="704" y="222" width="214" height="98" rx="3" fill="#222222" stroke="#363636"/>
 <text class="h" x="720" y="252">Our server add-on</text>
 <text class="s" x="720" y="276">Checks each pass, keeps</text>
 <text class="s" x="720" y="298">one character per account</text>
 <rect x="704" y="336" width="214" height="98" rx="3" fill="#222222" stroke="#363636"/>
 <text class="h" x="720" y="366">Legacy server</text>
 <text class="s" x="720" y="390">The owner's own copy.</text>
 <text class="s" x="720" y="412">Saves every character.</text>
 <rect x="704" y="450" width="214" height="108" rx="3" fill="#222222" stroke="#363636"/>
 <text class="h" x="720" y="480">Dashboard</text>
 <text class="s" x="720" y="504">Freeze watchdog, logs,</text>
 <text class="s" x="720" y="526">backups, schedules,</text>
 <text class="s" x="720" y="548">anti-cheat, updates</text>

 <!-- Arrows: sign in and passes (orange), play traffic (teal) -->
 <path d="M274 100H353" stroke="#cd5a28" stroke-width="2" fill="none" marker-end="url(#a)"/>
 <path d="M274 215H353" stroke="#cd5a28" stroke-width="2" fill="none" marker-end="url(#a)"/>
 <path d="M274 145C330 145 330 285 400 285H640C676 285 676 168 702 168" stroke="#5fa9a0" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#g)"/>
 <path d="M274 320H640C676 320 676 380 702 380" stroke="#5fa9a0" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#g)"/>
 <path d="M702 500C560 500 480 400 480 254" stroke="#cd5a28" stroke-width="2" fill="none" marker-end="url(#a)"/>
 <path d="M811 206V220M811 320V334" stroke="#5fa9a0" stroke-width="2" fill="none"/>

 <circle cx="313" cy="100" r="11" fill="#cd5a28"/><text class="n" x="313" y="105" text-anchor="middle">1</text>
 <circle cx="313" cy="215" r="11" fill="#cd5a28"/><text class="n" x="313" y="220" text-anchor="middle">1</text>
 <circle cx="560" cy="285" r="11" fill="#5fa9a0"/><text class="n" x="560" y="290" text-anchor="middle">2</text>
 <circle cx="560" cy="320" r="11" fill="#5fa9a0"/><text class="n" x="560" y="325" text-anchor="middle">3</text>
 <circle cx="583" cy="476" r="11" fill="#cd5a28"/><text class="n" x="583" y="481" text-anchor="middle">4</text>

 <!-- Key -->
 <text class="lbl" x="24" y="400">KEY</text>
 <text class="e" x="24" y="428">1  Sign in and get a one-use pass for the server</text>
 <text class="e" x="24" y="452">2  Browser play, through the gateway</text>
 <text class="e" x="24" y="476">3  Desktop play: the game joins with that pass</text>
 <text class="e" x="24" y="500">4  The host app reports status and logs, and</text>
 <text class="e" x="44" y="522">picks up the owner's commands</text>
 <path d="M24 552H64" stroke="#cd5a28" stroke-width="2"/><text class="e" x="74" y="557">website traffic</text>
 <path d="M200 552H240" stroke="#5fa9a0" stroke-width="2" stroke-dasharray="6 5"/><text class="e" x="250" y="557">game traffic</text>
</svg>
